server:
  port: 8081

spring:
  application:
    name: auth-service
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:false}
  config:
    import: "${SPRING_CONFIG_IMPORT:configserver:http://localhost:8888}"
  data:
    mongodb:
      uri: ${AUTH_DB_URI:mongodb://localhost:27017/auth_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  access-token-minutes: 15
  refresh-token-days: 7

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail-from: ${APP_MAIL_FROM:no-reply@novacart.local}
  cookie:
    secure: false # MUST be true in any HTTPS environment — CLAUDE.md §9. false only for local plain-HTTP dev.

management:
  endpoints:
    web:
      exposure:
        include: health,info
