server:
  port: 8089
spring:
  application:
    name: ai-assistant-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://ai_svc:ai_svc_pw@localhost:27017/ai_db}
  config:
    import: "${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}"
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

novacart:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/run/secrets/jwt_public_key}
  product-service-url: ${NOVACART_PRODUCT_SERVICE_URL:http://localhost:8082}
  order-service-url: ${NOVACART_ORDER_SERVICE_URL:http://localhost:8085}
  rag:
    initial-delay-ms: ${RAG_INITIAL_DELAY_MS:30000}
    refresh-ms: ${RAG_REFRESH_MS:900000}
    minimum-score: ${RAG_MINIMUM_SCORE:0.18}
    no-answer-score: ${RAG_NO_ANSWER_SCORE:0.24}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    response-model: ${OPENAI_RESPONSE_MODEL:gpt-4.1-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    response-model: ${GEMINI_RESPONSE_MODEL:gemini-3.8-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
