name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Java: build all modules + run tests ──────────────────────────────────────
  java-build:
    name: Java Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate dummy JWT keypair for tests
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out keys/jwt-private-key.pem 2>/dev/null
          openssl rsa -pubout \
            -in  keys/jwt-private-key.pem \
            -out keys/jwt-public-key.pem  2>/dev/null

      - name: Build and test all modules
        env:
          JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/keys/jwt-private-key.pem
          JWT_PUBLIC_KEY_PATH:  ${{ github.workspace }}/keys/jwt-public-key.pem
        run: ./mvnw clean verify -B --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  # ── Frontend: type-check + production build ──────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/novacart-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/novacart-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/novacart-web/dist/
          retention-days: 3
