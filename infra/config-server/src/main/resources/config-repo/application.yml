# Defaults applied to every service, regardless of spring.application.name —
# Spring Cloud Config's own convention for this filename. Service-specific overrides
# live in <service-name>.yml alongside this file.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
